<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="650" viewBox="0 0 1020 650" role="img" aria-label="A stable Network Load Balancer endpoint forwards game traffic to the live Fargate task"><title>A stable Network Load Balancer endpoint forwards game traffic to the live Fargate task</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#385b85"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f8fafc"/><rect x="230" y="25" width="560" height="85" rx="9" fill="#eaf2fc" stroke="#6689b3" stroke-width="1.5"/><text x="510.0" y="61.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#172c47"><tspan x="510.0" dy="0">Player&#x27;s client</tspan><tspan x="510.0" dy="24">world1-abc.elb.amazonaws.com : 43594</tspan></text><rect x="230" y="150" width="560" height="85" rx="9" fill="#eaf2fc" stroke="#6689b3" stroke-width="1.5"/><text x="510.0" y="186.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#172c47"><tspan x="510.0" dy="0">NLB (stable DNS name)</tspan><tspan x="510.0" dy="24">in public subnets</tspan></text><rect x="230" y="275" width="560" height="85" rx="9" fill="#eaf2fc" stroke="#6689b3" stroke-width="1.5"/><text x="510.0" y="311.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#172c47"><tspan x="510.0" dy="0">Listener :43594</tspan><tspan x="510.0" dy="24">forward to target group</tspan></text><rect x="230" y="400" width="560" height="85" rx="9" fill="#eaf2fc" stroke="#6689b3" stroke-width="1.5"/><text x="510.0" y="436.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#172c47"><tspan x="510.0" dy="0">Target group</tspan><tspan x="510.0" dy="24">live task IPs</tspan></text><rect x="230" y="525" width="560" height="8